spring.config.import=optional:file:.env[.properties]

spring.application.name=server
server.port=${SPRING_PORT}

spring.datasource.url=${SPRING_DATASOURCE_URL}
spring.datasource.username=${SPRING_DATASOURCE_USERNAME}
spring.datasource.password=${SPRING_DATASOURCE_PASSWORD}
spring.datasource.driver-class-name=org.postgresql.Driver
spring.jpa.database-platform=org.hibernate.dialect.PostgreSQLDialect
spring.jpa.show-sql=true

spring.flyway.enabled=true
spring.flyway.locations=classpath:db/migration
spring.flyway.baseline-on-migrate=true
spring.flyway.baseline-version=0
spring.jpa.hibernate.ddl-auto=validate

security.jwt.secret-key=${JWT_SECRET_KEY}
security.jwt.expiration-time=3600000

spring.mail.host=smtp.gmail.com
spring.mail.port=587
spring.mail.username=${SUPPORT_EMAIL}
spring.mail.password=${APP_PASSWORD}
spring.mail.properties.mail.smtp.auth=true
spring.mail.properties.mail.smtp.starttls.enable=true

app.email.verification-expiration-minutes=5
app.email.verification-resend-cooldown-seconds=60

mqtt.broker-url=${MQTT_BROKER_URL}
mqtt.client-id=${MQTT_CLIENT_ID}
mqtt.username=${MQTT_USERNAME}
mqtt.password=${MQTT_PASSWORD}
mqtt.broker.password-file=${MQTT_PASSWORD_FILE}
mqtt.broker.acl-file=${MQTT_ACL_FILE:aclfile}
mqtt.broker.password-command=${MQTT_PASSWORD_COMMAND:mosquitto_passwd}
mqtt.broker.reload-command=${MQTT_BROKER_RELOAD_COMMAND:}

app.device.pairing-expiration-minutes=10
app.device.measurements-retention-count=120
app.device.max-clock-drift-seconds=300
app.device.online-threshold-seconds=10
