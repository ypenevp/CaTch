spring.config.import=optional:file:.env[.properties],optional:file:server/.env[.properties]

spring.application.name=server
server.port=${SPRING_PORT}

spring.datasource.url=${SPRING_DATASOURCE_URL}
spring.datasource.username=${SPRING_DATASOURCE_USERNAME}
spring.datasource.password=${SPRING_DATASOURCE_PASSWORD}
spring.datasource.driver-class-name=org.postgresql.Driver
spring.jpa.database-platform=org.hibernate.dialect.PostgreSQLDialect
spring.jpa.show-sql=true

spring.flyway.enabled=true
spring.flyway.locations=classpath:db/migration
spring.flyway.baseline-on-migrate=true
spring.flyway.baseline-version=0
spring.jpa.hibernate.ddl-auto=validate

security.jwt.secret-key=${JWT_SECRET_KEY}
security.jwt.expiration-time=3600000

spring.mail.host=smtp.gmail.com
spring.mail.port=587
spring.mail.username=${SUPPORT_EMAIL}
spring.mail.password=${APP_PASSWORD}
spring.mail.properties.mail.smtp.auth=true
spring.mail.properties.mail.smtp.starttls.enable=true

app.email.verification-expiration-minutes=5
app.email.verification-resend-cooldown-seconds=60

mqtt.broker-url=${MQTT_BROKER_URL}
mqtt.client-id=${MQTT_CLIENT_ID}

app.device.pairing-expiration-minutes=10
app.device.measurements-retention-count=120
app.device.max-clock-drift-seconds=300
app.device.online-threshold-seconds=10
app.device.statistics-bucket-seconds=10
app.device.statistics-retention-minutes=60
app.device.statistics-default-window-minutes=10
app.device.statistics-max-window-minutes=60

app.ai.base-url=${AI_BASE_URL:http://127.0.0.1:8000}
app.ai.analysis-interval-ms=1000
app.ai.window-size=75
app.ai.min-new-measurements=38
app.ai.max-window-seconds=150
app.ai.connect-timeout-ms=2000
app.ai.read-timeout-ms=5000
app.ai.analyses-retention-count=1000

app.notification.fall-probability-threshold=0.75
app.notification.cooldown-seconds=60
app.firebase.credentials-path=${FIREBASE_CREDENTIALS_PATH:}
# The app creates this Android channel with high importance; until it exists, FCM uses its default channel
app.firebase.android-channel-id=fall-alerts
