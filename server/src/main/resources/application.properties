# for env
spring.config.import=optional:file:.env[.properties]

# for spring project
spring.application.name=server
server.port=${SPRING_PORT}

# for database
spring.datasource.url=${SPRING_DATASOURCE_URL}
spring.datasource.username=${SPRING_DATASOURCE_USERNAME}
spring.datasource.password=${SPRING_DATASOURCE_PASSWORD}

spring.datasource.driver-class-name=org.postgresql.Driver
spring.jpa.database-platform=org.hibernate.dialect.PostgreSQLDialect
spring.jpa.show-sql=true

# for flywheel
spring.flyway.enabled=true
spring.flyway.locations=classpath:db/migration
spring.flyway.baseline-on-migrate=true
spring.flyway.baseline-version=0
spring.jpa.hibernate.ddl-auto=validate

# for JWT
security.jwt.secret-key=${JWT_SECRET_KEY}
security.jwt.expiration-time=3600000

# for email
spring.mail.host=smtp.gmail.com
spring.mail.port=587
spring.mail.username=${SUPPORT_EMAIL}
spring.mail.password=${APP_PASSWORD}
spring.mail.properties.mail.smtp.auth=true
spring.mail.properties.mail.smtp.starttls.enable=true

app.email.verification-expiration-minutes=5
app.email.verification-resend-cooldown-seconds=60

# MQTT
MQTT_BROKER_URL=ssl://mqtt.example.com:1883
mqtt.username=${MQTT_USERNAME}
mqtt.password=${MQTT_PASSWORD}
MQTT_CLIENT_ID=catch-server
MQTT_TOPIC=devices/+/measurements
